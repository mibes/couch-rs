[package]
name = "couch_rs"
version = { workspace = true }
authors = [
  "Mathieu Amiot <mathieu.amiot@yellowinnovation.fr>",
  "Marcel Ibes <mibes@mibesco.com>",
]
license = "MIT/Apache-2.0"
description = "CouchDB library for Rust"
readme = "README.md"
documentation = "https://docs.rs/couch_rs"
repository = "https://github.com/mibes/couch-rs"
keywords = ["couchdb", "database", "nosql", "orm"]
categories = ["database"]
edition = { workspace = true }
include = ["**/*.rs", "Cargo.toml"]
rust-version = { workspace = true }

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1"
couch_rs_derive = { path = "../couch_rs_derive", version = "0.13.1", optional = true }
futures-core = "0.3"
futures-util = "0.3"
http = "1.1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "^1.49", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = ["gzip", "json", "query", "stream"]

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

[features]
default = ["derive", "native-tls", "tokio/rt-multi-thread"]
integration-tests = []

# Provide derive(CouchDocument) macros.
derive = ["couch_rs_derive"]

# tls backend, copied from reqwest
native-tls = ["reqwest/native-tls"]
native-tls-no-alpn = ["reqwest/native-tls-no-alpn"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
native-tls-vendored-no-alpn = ["reqwest/native-tls-vendored-no-alpn"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
rustls-tls = ["reqwest/rustls"]

[lints]
workspace = true
